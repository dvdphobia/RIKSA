spring:
  application:
    name: riksa-api

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:riksa_db}
    username: ${DB_USER:riksa_user}
    password: ${DB_PASSWORD:riksaUniquenessTeam}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: true

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      username: ${REDIS_USERNAME:}
      password: ${REDIS_PASSWORD:riksaRedis123}
      database: ${REDIS_DATABASE:0}
      connect-timeout: ${REDIS_CONNECT_TIMEOUT:2s}
      timeout: ${REDIS_TIMEOUT:2s}
      ssl:
        enabled: ${REDIS_SSL_ENABLED:false}

  cache:
    type: redis
    redis:
      key-prefix: "${REDIS_KEY_PREFIX:riksa:dev}:cache:"
      use-key-prefix: true
      cache-null-values: false
      time-to-live: 30s

  servlet:
    multipart:
      max-file-size: ${MULTIPART_MAX_FILE_SIZE:2MB}
      max-request-size: ${MULTIPART_MAX_REQUEST_SIZE:20MB}

server:
  port: ${PORT:8080}

jwt:
  secret: ${JWT_SECRET:CHANGE-ME-IN-PRODUCTION-MUST-BE-256-BITS-OR-LONGER}
  access-expiration: ${JWT_ACCESS_EXPIRATION:900000}
  refresh-expiration: ${JWT_REFRESH_EXPIRATION:2592000000}

otp:
  expiration-minutes: ${OTP_EXPIRATION_MINUTES:5}
  max-attempts: ${OTP_MAX_ATTEMPTS:3}
  code-length: ${OTP_CODE_LENGTH:6}
  hash-secret: ${OTP_HASH_SECRET:${JWT_SECRET:CHANGE-ME-IN-PRODUCTION-MUST-BE-256-BITS-OR-LONGER}}

telegram:
  enabled: ${TELEGRAM_ENABLED:true}
  bot-token: ${TELEGRAM_BOT_TOKEN:}
  bot-username: ${TELEGRAM_BOT_USERNAME:}
  webhook-url: ${TELEGRAM_WEBHOOK_URL:}
  webhook-secret: ${TELEGRAM_WEBHOOK_SECRET:}
  auth-request-expiration-minutes: ${TELEGRAM_AUTH_REQUEST_EXPIRATION_MINUTES:10}

google:
  client:
    id: ${GOOGLE_CLIENT_ID:}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}

rate-limit:
  auth:
    max-requests: ${RATE_LIMIT_AUTH_MAX:5}
    window-seconds: ${RATE_LIMIT_AUTH_WINDOW:60}
  trust-forward-headers: ${RATE_LIMIT_TRUST_FORWARD_HEADERS:false}

riksa:
  redis:
    prefix: ${REDIS_KEY_PREFIX:riksa:dev}
    rate-limit-enabled: ${REDIS_RATE_LIMIT_ENABLED:true}
    otp-enabled: ${REDIS_OTP_ENABLED:true}
    cache-enabled: ${REDIS_CACHE_ENABLED:true}
    leaderboard-enabled: ${REDIS_LEADERBOARD_ENABLED:true}

login:
  max-failed-attempts: ${LOGIN_MAX_FAILED_ATTEMPTS:5}
  lockout-minutes: ${LOGIN_LOCKOUT_MINUTES:15}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true
  health:
    readinessstate:
      enabled: true
    livenessstate:
      enabled: true

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%X{requestId:-none}] %-5level %logger{36} - %msg%n"
  level:
    com.riksa: INFO
    org.springframework.security: WARN
