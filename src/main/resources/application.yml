spring:
  application:
    name: riksa-api

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:riksa_db}
    username: ${DB_USER:riksa_user}
    password: ${DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: true

  servlet:
    multipart:
      max-file-size: ${MULTIPART_MAX_FILE_SIZE:2MB}
      max-request-size: ${MULTIPART_MAX_REQUEST_SIZE:20MB}

server:
  port: ${PORT:8080}

jwt:
  secret: ${JWT_SECRET:CHANGE-ME-IN-PRODUCTION-MUST-BE-256-BITS-OR-LONGER}
  access-expiration: ${JWT_ACCESS_EXPIRATION:900000}
  refresh-expiration: ${JWT_REFRESH_EXPIRATION:2592000000}

otp:
  expiration-minutes: ${OTP_EXPIRATION_MINUTES:5}
  max-attempts: ${OTP_MAX_ATTEMPTS:3}
  code-length: ${OTP_CODE_LENGTH:6}

telegram:
  enabled: ${TELEGRAM_ENABLED:true}
  bot-token: ${TELEGRAM_BOT_TOKEN:}
  bot-username: ${TELEGRAM_BOT_USERNAME:}

google:
  client:
    id: ${GOOGLE_CLIENT_ID:}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}

rate-limit:
  auth:
    max-requests: ${RATE_LIMIT_AUTH_MAX:5}
    window-seconds: ${RATE_LIMIT_AUTH_WINDOW:60}

login:
  max-failed-attempts: ${LOGIN_MAX_FAILED_ATTEMPTS:5}
  lockout-minutes: ${LOGIN_LOCKOUT_MINUTES:15}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true
  health:
    readinessstate:
      enabled: true
    livenessstate:
      enabled: true

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%X{requestId:-none}] %-5level %logger{36} - %msg%n"
  level:
    com.riksa: INFO
    org.springframework.security: WARN
