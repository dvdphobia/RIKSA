spring:
  application:
    name: riksa-api

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:riksa}
    username: ${DB_USER:riksa}
    password: ${DB_PASSWORD:riksa}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
    show-sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${PORT:8080}

app:
  jwt:
    secret: ${JWT_SECRET:change-me-to-a-strong-random-secret-at-least-256-bits}
    access-token-expiration: ${JWT_ACCESS_EXPIRATION:900000}    # 15 minutes
    refresh-token-expiration: ${JWT_REFRESH_EXPIRATION:2592000000}  # 30 days

  otp:
    expiration-minutes: ${OTP_EXPIRATION_MINUTES:5}
    max-attempts: ${OTP_MAX_ATTEMPTS:3}
    code-length: ${OTP_CODE_LENGTH:6}

  google:
    client-id: ${GOOGLE_CLIENT_ID:your-google-client-id}

logging:
  level:
    com.riksa: DEBUG
    org.springframework.security: DEBUG
