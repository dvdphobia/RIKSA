spring:
  application:
    name: riksa-api

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:riksa_db}
    username: ${DB_USER:riksa_user}
    password: ${DB_PASSWORD:riksaUniquenessTeam}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: true

server:
  port: ${PORT:8080}

jwt:
  secret: ${JWT_SECRET:riksa-dev-secret-key-uniqueness-team}
  access-expiration: ${JWT_ACCESS_EXPIRATION:900000}
  refresh-expiration: ${JWT_REFRESH_EXPIRATION:2592000000}

otp:
  expiration-minutes: ${OTP_EXPIRATION_MINUTES:5}
  max-attempts: ${OTP_MAX_ATTEMPTS:3}
  code-length: ${OTP_CODE_LENGTH:6}

google:
  client:
    id: ${GOOGLE_CLIENT_ID:}

logging:
  level:
    com.riksa: DEBUG
    org.springframework.security: DEBUG
