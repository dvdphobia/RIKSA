<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>Verify your Riksa email</title>
  <style>
    body { margin: 0; padding: 2rem 1rem; color: #17212b; background: #f4f7f6; font: 16px/1.5 system-ui, sans-serif; }
    main { max-width: 32rem; margin: 10vh auto; padding: 2rem; border-radius: 1rem; background: white; box-shadow: 0 0.5rem 2rem #102a3518; }
    button { padding: 0.8rem 1.2rem; border: 0; border-radius: 0.6rem; color: white; background: #176b55; font: inherit; font-weight: 650; cursor: pointer; }
    button:disabled { opacity: 0.6; cursor: wait; }
    input { box-sizing: border-box; width: 100%; margin: 0.5rem 0 1rem; padding: 0.7rem; border: 1px solid #9caaa5; border-radius: 0.5rem; font: inherit; }
    #status, #resend-status { min-height: 1.5em; }
    hr { margin: 2rem 0; border: 0; border-top: 1px solid #e1e8e5; }
  </style>
</head>
<body>
  <main>
    <h1>Verify your email</h1>
    <p>Confirm this email address to finish setting up your Riksa account.</p>
    <button id="confirm" type="button">Confirm email</button>
    <p id="status" role="status" aria-live="polite"></p>

    <hr>

    <h2>Need another email?</h2>
    <p>Enter your email address and we’ll send a new verification message if the account needs one.</p>
    <form id="resend-form">
      <label for="email">Email address</label>
      <input id="email" name="email" type="email" autocomplete="email" maxlength="254" required>
      <button id="resend" type="submit">Resend verification email</button>
    </form>
    <p id="resend-status" role="status" aria-live="polite"></p>
  </main>
  <script>
    const token = new URLSearchParams(window.location.hash.slice(1)).get("token");
    const confirmButton = document.getElementById("confirm");
    const status = document.getElementById("status");

    // Remove the one-time token from the visible URL before the user confirms.
    window.history.replaceState(null, document.title, window.location.pathname);
    if (!token) {
      confirmButton.disabled = true;
      status.textContent = "This verification link is missing its token. You can request a new email below.";
    }

    confirmButton.addEventListener("click", async () => {
      if (!token) return;
      confirmButton.disabled = true;
      status.textContent = "Confirming your email…";
      try {
        const response = await fetch("/api/v1/auth/verify-email", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ token })
        });
        const result = await response.json().catch(() => ({}));
        if (!response.ok || !result.verified) {
          throw new Error("This link may have expired or already been used.");
        }
        status.textContent = "Your email is verified. You can return to Riksa.";
        confirmButton.hidden = true;
      } catch (error) {
        status.textContent = error.message || "Email verification failed. Request a new email below.";
        confirmButton.disabled = false;
      }
    });

    const resendForm = document.getElementById("resend-form");
    const resendButton = document.getElementById("resend");
    const resendStatus = document.getElementById("resend-status");

    resendForm.addEventListener("submit", async (event) => {
      event.preventDefault();
      resendButton.disabled = true;
      resendStatus.textContent = "Requesting a verification email…";
      try {
        const email = new FormData(resendForm).get("email");
        const response = await fetch("/api/v1/auth/resend-verification-email", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ email })
        });
        if (!response.ok) {
          throw new Error("The request could not be completed. Try again later.");
        }
        resendStatus.textContent =
          "If an account exists and needs verification, a new email will be sent.";
      } catch (error) {
        resendStatus.textContent = error.message || "The request could not be completed. Try again later.";
        resendButton.disabled = false;
      }
    });
  </script>
</body>
</html>
