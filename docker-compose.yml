services:
  postgres:
    image: postgres:18
    container_name: riksa-postgres
    environment:
      POSTGRES_DB: riksa_db
      POSTGRES_USER: riksa_user
      POSTGRES_PASSWORD: ${DB_PASSWORD:-riksaPass123}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U riksa_user -d riksa_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: riksa-api
    ports:
      - "8080:8080"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: riksa_db
      DB_USER: riksa_user
      DB_PASSWORD: ${DB_PASSWORD:-riksaPass123}
      JWT_SECRET: ${JWT_SECRET}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_BOT_USERNAME: ${TELEGRAM_BOT_USERNAME:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
