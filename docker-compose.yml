services:
  redis:
    image: redis:8.2-alpine
    container_name: riksa-redis
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-riksaRedis123}
    command: ["sh", "-c", "exec redis-server --appendonly no --maxmemory-policy noeviction --requirepass \"$$REDIS_PASSWORD\""]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$REDIS_PASSWORD\" redis-cli ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  postgres:
    image: postgres:17
    container_name: riksa-postgres
    environment:
      POSTGRES_DB: riksa_db
      POSTGRES_USER: riksa_user
      POSTGRES_PASSWORD: ${DB_PASSWORD:-riksaPass123}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U riksa_user -d riksa_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: riksa-api
    ports:
      - "8080:8080"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: riksa_db
      DB_USER: riksa_user
      DB_PASSWORD: ${DB_PASSWORD:-riksaPass123}
      JWT_SECRET: ${JWT_SECRET}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      TELEGRAM_ENABLED: ${TELEGRAM_ENABLED:-true}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_BOT_USERNAME: ${TELEGRAM_BOT_USERNAME:-}
      TELEGRAM_WEBHOOK_URL: ${TELEGRAM_WEBHOOK_URL:-}
      TELEGRAM_WEBHOOK_SECRET: ${TELEGRAM_WEBHOOK_SECRET:-}
      TELEGRAM_AUTH_REQUEST_EXPIRATION_MINUTES: ${TELEGRAM_AUTH_REQUEST_EXPIRATION_MINUTES:-10}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-riksaRedis123}
      REDIS_KEY_PREFIX: ${REDIS_KEY_PREFIX:-riksa:local}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
