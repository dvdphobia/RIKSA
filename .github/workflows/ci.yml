name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: riksa_test
          POSTGRES_USER: riksa_user
          POSTGRES_PASSWORD: test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Run tests
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: riksa_test
          DB_USER: riksa_user
          DB_PASSWORD: test_password
          JWT_SECRET: test-secret-key-that-is-at-least-256-bits-long-for-ci
          CORS_ALLOWED_ORIGINS: http://localhost:3000
        run: ./mvnw verify -B

      - name: Build Docker image
        run: docker build -t riksa-api:latest .

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: target/surefire-reports/
